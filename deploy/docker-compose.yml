# NIGHTPASS public demo: one preprod instance for explorer and demo, behind Caddy.
# Setup steps in deploy/README.md.

# Bounded json-file logging for every service. The default is unbounded, and
# this host has already run its disk to 93% once; a wallet-sync error storm can
# produce gigabytes in hours.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One instance serves the explorer and the "Try it" demo. Runs prove here and
  # go to the hosted NIGHTGATE under an agent grant, which pays the dust.
  nightpass-demo:
    build: ..
    restart: unless-stopped
    logging: *default-logging
    # 4g carries wasm/server proving plus CAP; the wallet-worker era needed 12g.
    mem_limit: 4g
    env_file: .env.demo
    # Schema is deployed as a one-off before up (README): the deploy step
    # keeps the plugin event loop alive and never returns inside the CMD.
    command: ["sh", "-c", "exec npx cds-tsx serve"]
    environment:
      NIGHTGATE_REPLICA_COUNT: "1"
      # Prover keys fetched once from the hosted /zk-config, kept on a volume.
      NIGHTGATE_ZK_CACHE_DIR: /data/zk-cache
      cds_requires_db_credentials_host: postgres-demo
      cds_requires_db_credentials_port: "5432"
      cds_requires_db_credentials_user: nightpass_demo
      cds_requires_db_credentials_password: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      cds_requires_db_credentials_database: nightpass_demo
    volumes:
      - passport-demo-zk-cache:/data/zk-cache
    expose: ["4004"]
    # Wedged-process detection. demoInfo is DB-free and cheap; a container
    # that stops answering HTTP goes unhealthy. Docker itself only MARKS the
    # state: the actual recovery is demo-autoheal.sh from host cron, because
    # the restart policy ignores health and a wedged process can even survive
    # `docker restart` (2026-08-02 outage). No curl in node:22-slim, so the
    # probe uses node's built-in fetch.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/api/v1/demo/demoInfo()').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      # The remote lane builds transactions on the CAP thread; a probe can wait
      # behind a build, so the timeout must clear one build step.
      timeout: 30s
      retries: 5
      start_period: 300s
    depends_on:
      proof-server:
        condition: service_started
      postgres-demo:
        condition: service_healthy

  postgres-demo:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    environment:
      POSTGRES_DB: nightpass_demo
      POSTGRES_USER: nightpass_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightpass_demo -d nightpass_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - passport-demo-pg-data:/var/lib/postgresql/data

  # ZK proof server for the demo instance's anchor/proof transactions. It
  # RECEIVES THE WITNESSES, so it is ours and internal-only, never the hosted
  # sponsor's. Optional: without NIGHTGATE_PROOF_SERVER_URL the remote lane
  # proves in-process (wasm, 25-75 s per transaction and it blocks the
  # request thread while proving).
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 8g
    command: ["midnight-proof-server"]
    expose: ["6300"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    ports: ["80:80", "443:443"]
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN}
      # Demo subdomain. The fallback keeps Caddy loading when it is unset.
      TRY_DOMAIN: ${TRY_DOMAIN:-demo.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  passport-demo-pg-data:
  caddy-data:
  caddy-config:
  passport-demo-zk-cache:
