<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <!--
    NIGHTPASS architecture, pitch version. ONE idea: your data stays behind
    the lock; only a 32-byte fingerprint crosses to Midnight. Word budget ~25,
    nothing below 18px. Palette validated on #0A0F1E (see pitch-deck.html).
    Render: node docs/render-diagram.mjs
  -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22A97B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#45D9A3"/>
      <stop offset="1" stop-color="#22A97B" stop-opacity="0"/>
    </linearGradient>
    <marker id="parr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#45D9A3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="760" fill="#0A0F1E"/>

  <!-- ══ left: your data ══ -->
  <rect x="60" y="90" width="520" height="470" rx="18" fill="#101729" stroke="#243052" stroke-width="1.5"/>

  <!-- padlock icon -->
  <g transform="translate(320 200)">
    <path d="M -52 0 v -26 a 52 52 0 0 1 104 0 v 26" fill="none" stroke="#B4882F" stroke-width="11" stroke-linecap="round"/>
    <rect x="-74" y="0" width="148" height="112" rx="16" fill="#171420" stroke="#B4882F" stroke-width="11"/>
    <circle cx="0" cy="48" r="14" fill="#E5C061"/>
    <rect x="-6" y="48" width="12" height="34" rx="6" fill="#E5C061"/>
  </g>

  <text x="320" y="420" font-size="40" font-weight="700" fill="#EAEFFA" text-anchor="middle">Your data</text>
  <text x="320" y="460" font-size="21" fill="#93A1C0" text-anchor="middle">SAP &#183; passports &#183; encrypted</text>
  <text x="320" y="520" font-size="19" fill="#B4882F" text-anchor="middle">never leaves your infrastructure</text>

  <!-- ══ the crossing ══ -->
  <rect x="658" y="90" width="4" height="470" fill="url(#beam)"/>
  <line x1="600" y1="325" x2="712" y2="325" stroke="#45D9A3" stroke-width="5" marker-end="url(#parr)"/>
  <rect x="596" y="270" width="128" height="44" rx="10" fill="#0A0F1E" stroke="#45D9A3" stroke-width="2.5"/>
  <text x="660" y="299" font-size="21" fill="#45D9A3" text-anchor="middle" font-family="Consolas, monospace">#c83576&#8230;</text>
  <text x="660" y="620" font-size="27" font-weight="600" fill="#45D9A3" text-anchor="middle">Only a 32-byte fingerprint ever crosses.</text>

  <!-- ══ right: midnight ══ -->
  <rect x="740" y="90" width="520" height="470" rx="18" fill="#0D1430" stroke="#31406B" stroke-width="1.5"/>

  <!-- cube icon -->
  <g stroke="#6E86F7" stroke-width="10" stroke-linejoin="round">
    <polygon points="1000,120 1084,168 1000,216 916,168" fill="#111A3A"/>
    <polygon points="916,168 1000,216 1000,312 916,264" fill="#0D1430"/>
    <polygon points="1084,168 1000,216 1000,312 1084,264" fill="#101a45"/>
  </g>
  <circle cx="1084" cy="152" r="26" fill="#0A0F1E" stroke="#22A97B" stroke-width="6"/>
  <path d="M 1072 152 l 9 10 l 17 -19" fill="none" stroke="#45D9A3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1000" y="420" font-size="40" font-weight="700" fill="#EAEFFA" text-anchor="middle">Midnight</text>
  <text x="1000" y="460" font-size="21" fill="#93A1C0" text-anchor="middle">proof &#183; public &#183; forever</text>
  <text x="1000" y="520" font-size="19" fill="#8FA1E8" text-anchor="middle">anyone verifies, nobody trusts us</text>

  <!-- ══ bottom: three views ══ -->
  <g font-size="21" font-weight="600" fill="#EAEFFA">
    <circle cx="330" cy="688" r="11" fill="#22A97B"/>
    <text x="352" y="695">Public</text>
    <circle cx="560" cy="688" r="11" fill="#6E86F7"/>
    <text x="582" y="695">Recycler</text>
    <circle cx="820" cy="688" r="11" fill="#D2618F"/>
    <text x="842" y="695">Authority</text>
  </g>
  <text x="660" y="656" font-size="19" fill="#93A1C0" text-anchor="middle">one dataset &#183; three legal views</text>
</svg>
